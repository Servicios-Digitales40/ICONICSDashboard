# Integración continua.
#
# ── POR QUÉ EXISTE ────────────────────────────────────────────────────
#
# `CLAUDE.md` §5 tiene una regla de oro: un cambio que toca `backend/ia/` corre
# como mínimo `verificar-herramientas.mjs`, y un cambio en `shared/eva/` corre
# los verificadores de las dos instalaciones. Hasta hoy esa regla era disciplina
# personal, y la disciplina personal falla justo el día que hay prisa — que es
# el día en que más falta hace.
#
# Los veinte `verificar-*.mjs` levantan un ICONICS y un llama-server falsos: ya
# estaban hechos para correr sin red, sólo que nadie los ejecutaba solo.
#
# ── POR QUÉ CUATRO TRABAJOS Y NO UNO ──────────────────────────────────
#
# Para que el rojo diga DÓNDE. Un solo trabajo que corre linter, dos suites y
# diecisiete verificadores contesta «falló CI», y hay que abrir el registro para
# saber si fue un tipo mal escrito o una regla de riesgo. Cuatro trabajos
# contestan «falló el linter» sin abrir nada, y además corren a la vez.
#
# ── LA VERSIÓN DE NODE SE DECLARA EN `.nvmrc`, NO AQUÍ ────────────────
#
# Aquí ponía `node-version: '22'` escrito a mano en los cuatro trabajos, y la
# máquina de desarrollo corría Node 24. Eso reventó CI el 07-09-2026, y el
# modo de fallo merece quedar escrito porque no se ve venir:
#
# Un `npm uninstall` en la máquina de desarrollo (npm 11) reescribió
# `react-dashboard/package-lock.json` con el árbol que npm 11 considera
# correcto — quitando, entre otras cosas, las entradas anidadas de
# `vitest/node_modules/@esbuild/*`. npm 10 (el que trae Node 22) calcula un
# árbol distinto, así que al leer ese lockfile se negó:
#
#     npm error Missing: @esbuild/win32-x64@0.28.2 from lock file
#
# Nadie tocó nada de CI. Simplemente el lockfile lo ESCRIBE una versión de npm
# y lo CONSUME otra, y `npm ci` —cuyo trabajo es justamente no improvisar— hace
# lo correcto y falla. Los otros tres trabajos pasaron porque sus árboles son
# lo bastante simples como para que las dos versiones coincidan: no es que
# estuvieran a salvo, es que tuvieron suerte.
#
# Por eso el número vive en `.nvmrc` y estos cuatro trabajos lo LEEN. Uno solo
# que se quede rezagado reproduce el fallo entero, y con el número repetido
# cuatro veces eso es cuestión de tiempo. Los tres `package.json` declaran
# además `engines`, para que instalar con otra mayor avise en el momento en vez
# de dejar el aviso para el siguiente que empuje a CI.
#
# ── LO QUE ESTE FLUJO NO PUEDE COMPROBAR ──────────────────────────────
#
# Nada que necesite la red de planta ni una GPU: la sonda contra el historiador
# real (`verificar-antiguedad-historico.mjs`) y los instrumentos `medir-*`, que
# necesitan llama-server. La lista con su motivo vive en
# `scripts/verificar-todo.mjs`, no aquí, para que no haya dos inventarios.
#
# Tampoco silencia el aviso de que `actions/checkout@v4` y `setup-node@v4`
# apuntan a Node 20: siguen funcionando —el runner las fuerza a Node 24— y
# subirlas de major es su propio cambio, no un efecto colateral de éste.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Un push nuevo sobre la misma rama cancela la tanda anterior: en una rama
# activa, la penúltima tanda ya no le importa a nadie y ocupa runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linter y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Comprobación de tipos sobre shared/
        run: npm run types

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  frontend:
    name: Tablero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: react-dashboard/package-lock.json
      - run: npm ci
        working-directory: react-dashboard
      - run: npm test
        working-directory: react-dashboard
      - name: Compilar
        run: npm run build
        working-directory: react-dashboard
      # Sólo tiene sentido con `dist/` recién hecho: comprueba que la pila 3D no
      # viaja en el chunk de arranque. Por eso vive aquí y no en la tanda de
      # verificadores, que corre sin compilar.
      - name: El presupuesto del bundle
        run: node scripts/verificar-bundle.mjs

  verificadores:
    name: Verificadores sin red
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Los verificadores importan `backend/app.mjs` y sus rutas, así que
      # necesitan las dependencias del servidor. NO necesitan las del tablero:
      # ninguno monta React.
      - run: npm ci
        working-directory: backend
      - run: node scripts/verificar-todo.mjs
